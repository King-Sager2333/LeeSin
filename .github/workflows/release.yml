name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 匹配v开头的tag，如v1.0.0, v2.1.3
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如 v1.0.0，留空则自动使用 package.json 的版本）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [windows-latest]
        include:
          - os: windows-latest
            artifact_name: LeeSin-Windows-x64
            package_suffix: win

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update version from tag
        shell: bash
        run: |
          INPUT_VER="${{ github.event.inputs.version }}"
          if [ -n "$INPUT_VER" ]; then
            if [[ "$INPUT_VER" == v* ]]; then
              TAG="$INPUT_VER"
            else
              TAG="v$INPUT_VER"
            fi
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          VERSION=${TAG#v}
          npm version $VERSION --no-git-tag-version --allow-same-version
          echo "Building version: $VERSION"

      - name: Build and package
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build
          npm run package:${{ matrix.package_suffix }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/*
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from tag
        run: |
          INPUT_VER="${{ github.event.inputs.version }}"
          if [ -n "$INPUT_VER" ]; then
            if [[ "$INPUT_VER" == v* ]]; then
              TAG="$INPUT_VER"
            else
              TAG="v$INPUT_VER"
            fi
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "VERSION=$TAG" >> $GITHUB_ENV
          echo "Building release: $TAG"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          name: ${{ env.VERSION }}
          tag: ${{ env.VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}
          replacesArtifacts: false
          allowUpdates: true
          generateReleaseNotes: true
          artifacts: |
            artifacts/LeeSin-Windows-x64/*
          body: |
            ## LeeSin ${{ env.VERSION }}
            
            ### 下载安装
            - **Windows**: 下载后解压，运行 `LeeSin.exe`
            
            ### 注意事项
            - Windows: 如果杀毒软件误报，请添加信任
            
            ### 更新日志
            请查看 Git 提交记录获取详细更新信息
