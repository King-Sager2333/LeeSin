name: Build Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [windows-latest]
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install 7-Zip
        shell: pwsh
        run: |
          choco install 7zip 7zip.commandline -y
          if (-not (Get-Command 7za -ErrorAction SilentlyContinue)) {
            $7zDir = "C:\Program Files\7-Zip"
            if (Test-Path "$7zDir\7z.exe") {
              Copy-Item "$7zDir\7z.exe" "$7zDir\7za.exe" -Force
              echo "$7zDir" >> $env:GITHUB_PATH
            }
          }

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Build application
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build
